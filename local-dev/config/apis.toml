# API configuration for local development.
#
# To add external API integrations, define them here and add
# corresponding secrets to secrets/secrets.toml.
#
# See the full config reference in runtime/plaid/resources/jrp_config/apis.toml
# for examples of GitHub, Slack, AWS, GCP, blockchain, and other integrations.

[apis."general"]

# ──────────────────────────────────────────────────────────────
# http-proxy example: outbound HTTP requests to httpbin.org
# ──────────────────────────────────────────────────────────────

[apis."general".network.web_requests."httpbin_get"]
verb = "get"
uri = "https://httpbin.org/get"
return_body = true
return_code = true
return_cert = false
allowed_rules = ["http_proxy.wasm"]
[apis."general".network.web_requests."httpbin_get".headers]

[apis."general".network.web_requests."httpbin_post"]
verb = "post"
uri = "https://httpbin.org/post"
return_body = true
return_code = true
return_cert = false
allowed_rules = ["http_proxy.wasm"]
[apis."general".network.web_requests."httpbin_post".headers]
Content-Type = "application/json"

# ──────────────────────────────────────────────────────────────
# postgres-reader example: parameterized reads from a local database
# ──────────────────────────────────────────────────────────────

# These credentials are intentionally local-only. The PostgreSQL service is
# reachable only inside the Compose network and the role has SELECT access to
# the seeded demo table.
[apis.postgres.connections.local_readonly]
connection_string = "host=postgres port=5432 dbname=plaid_local user=plaid_reader password=plaid_reader sslmode=disable"
allowed_rules = ["postgres_reader.wasm"]
max_pool_size = 4
pool_timeout_ms = 2000
connection_timeout_ms = 3000
recycle_timeout_ms = 1000
total_timeout_ms = 7000
statement_timeout_ms = 5000
lock_timeout_ms = 1000
idle_transaction_timeout_ms = 5000
max_query_size = 65536
max_parameters = 10
max_rows = 100
max_response_size = 65536

[apis.postgres.connections.local_readonly.tls]
mode = "disable"

