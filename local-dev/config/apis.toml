# API configuration for local development.
#
# To add external API integrations, define them here and add
# corresponding secrets to secrets/secrets.toml.
#
# See the full config reference in runtime/plaid/resources/jrp_config/apis.toml
# for examples of GitHub, Slack, AWS, GCP, blockchain, and other integrations.

[apis."general"]

# ──────────────────────────────────────────────────────────────
# http-proxy example: outbound HTTP requests to httpbin.org
# ──────────────────────────────────────────────────────────────

[apis."general".network.web_requests."httpbin_get"]
verb = "get"
uri = "https://httpbin.org/get"
return_body = true
return_code = true
return_cert = false
allowed_rules = ["http_proxy.wasm"]
[apis."general".network.web_requests."httpbin_get".headers]

[apis."general".network.web_requests."httpbin_post"]
verb = "post"
uri = "https://httpbin.org/post"
return_body = true
return_code = true
return_cert = false
allowed_rules = ["http_proxy.wasm"]
[apis."general".network.web_requests."httpbin_post".headers]
Content-Type = "application/json"

# ──────────────────────────────────────────────────────────────
# GitHub rate-limit metrics example
# ──────────────────────────────────────────────────────────────
# No token is needed: the unauthenticated client still returns
# x-ratelimit-* headers, so the metrics endpoint shows quota state
# after the github-rate-limit webhook runs.

[apis."github"]
[apis."github".authentication.noauth]
[apis."github".graphql_queries]

